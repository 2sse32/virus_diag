<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction Assurance - Machine Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Calculateur de Frais d'Assurance</h2>
        <form action="/predict" method="POST">
            <div class="form-group">
                <label for="age">Âge :</label>
                <input type="number" id="age" name="age" min="18" max="100" required>
            </div>

            <div class="form-group">
                <label for="sex">Sexe :</label>
                <select id="sex" name="sex" required>
                    <option value="male">Homme</option>
                    <option value="female">Femme</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bmi">IMC (BMI) :</label>
                <input type="number" step="0.1" id="bmi" name="bmi" placeholder="ex: 24.5" required>
            </div>

            <div class="form-group">
                <label for="children">Nombre d'enfants :</label>
                <input type="number" id="children" name="children" min="0" max="10" required>
            </div>

            <div class="form-group">
                <label for="smoker">Fumeur :</label>
                <select id="smoker" name="smoker" required>
                    <option value="no">Non</option>
                    <option value="yes">Oui</option>
                </select>
            </div>

            <div class="form-group">
                <label for="region">Région :</label>
                <select id="region" name="region" required>
                    <option value="southwest">Southwest</option>
                    <option value="southeast">Southeast</option>
                    <option value="northwest">Northwest</option>
                    <option value="northeast">Northeast</option>
                </select>
            </div>

            <button type="submit">Prédire les Frais</button>
        </form>

        {% if prediction_result %}
        <div class="result">
            <h3>{{ prediction_result }}</h3>
        </div>
        {% endif %}
    </div>
</body>
</html>
